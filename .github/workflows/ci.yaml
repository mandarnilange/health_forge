name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: dart pub get

      - name: Activate Melos on PATH
        run: dart pub global activate melos

      - name: Bootstrap
        run: dart run melos bootstrap

      - name: Generate
        run: dart run melos run generate --no-select

      - name: Analyze
        run: dart run melos run analyze --no-select

      - name: Analyze example
        run: cd example && dart analyze --fatal-infos

      - name: Format
        run: dart run melos run format --no-select

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Test with coverage (packages)
        run: dart run melos run test:coverage --no-select

      - name: Test example app (no coverage gate)
        run: cd example && flutter test

      - name: Merge package coverage (optional report)
        run: bash tool/merge_lcov.sh

      - name: Verify per-package coverage (>=90%, example excluded)
        run: dart run tool/verify_packages_coverage.dart

      - name: Upload merged package lcov
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov-packages
          path: coverage/lcov.info

  # Full test suite at the lowest dependency versions the pubspecs allow
  # (e.g. flutter_secure_storage 10.x), so widened ranges can't rot.
  lowest-deps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve lowest allowed versions
        run: dart pub downgrade

      - name: Generate
        run: dart run melos run generate --no-select

      - name: Analyze
        run: dart run melos run analyze --no-select

      - name: Test
        run: dart run melos run test --no-select

  # The published packages declare Dart >=3.10.0 / Flutter >=3.38.1, below the
  # contributor toolchain. Check they resolve and compile on that floor
  # (see design/adr/0008-dependency-and-sdk-support-policy.md).
  sdk-floor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate code with the contributor toolchain
        run: |
          dart pub get
          dart run melos run generate --no-select

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.1

      - name: Resolve and analyze published packages on Flutter 3.38.1
        run: bash tool/check_min_sdk.sh
