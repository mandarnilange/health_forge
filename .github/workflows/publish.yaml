name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual trigger runs the verify job only. pub.dev accepts automated
    # publishing solely from workflows triggered by pushing a matching tag,
    # so the publish jobs are limited to tag pushes. Push release tags with
    # your own credentials: tags pushed with GITHUB_TOKEN don't trigger
    # this workflow.

# Publish requires the OIDC token for pub.dev authentication
permissions:
  id-token: write

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: dart pub get

      - name: Activate Melos on PATH
        run: dart pub global activate melos

      - name: Bootstrap
        run: dart run melos bootstrap

      - name: Generate
        run: dart run melos run generate --no-select

      - name: Analyze
        run: dart run melos run analyze --no-select

      - name: Format
        run: dart run melos run format --no-select

      - name: Test
        run: dart run melos run test --no-select

  publish-core:
    name: Publish health_forge_core
    needs: verify
    # pub.dev only accepts automated publishing from a tag push matching the
    # package's tag pattern (v{{version}}), so never publish from other refs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      PKG: health_forge_core
    steps:
      - uses: actions/checkout@v7

      # Flutter SDK is required even for this pure-Dart package: the pub
      # workspace root includes the Flutter `example`, so a Dart-only
      # `pub get` fails version solving.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: dart pub get

      - name: Skip if version already published
        id: check
        run: |
          VERSION=$(awk '/^version:/{print $2; exit}' "packages/$PKG/pubspec.yaml")
          if curl -sfI "https://pub.dev/api/packages/$PKG/versions/$VERSION" >/dev/null; then
            echo "$PKG $VERSION already on pub.dev — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Activate Melos on PATH
        if: steps.check.outputs.skip == 'false'
        run: dart pub global activate melos

      - name: Bootstrap
        if: steps.check.outputs.skip == 'false'
        run: dart run melos bootstrap

      - name: Generate
        if: steps.check.outputs.skip == 'false'
        run: dart run melos run generate --no-select

      - name: Dry run
        if: steps.check.outputs.skip == 'false'
        run: cd "packages/$PKG" && dart pub publish --dry-run

      # setup-dart fetches the short-lived GitHub OIDC token for pub.dev and
      # registers it with `dart pub token add`. Without it, `dart pub publish`
      # waits forever for an interactive browser login. It runs right before
      # publishing so the token is fresh.
      - uses: dart-lang/setup-dart@v1
        if: steps.check.outputs.skip == 'false'

      # setup-dart puts a standalone Dart first on PATH; put Flutter's back in
      # front so the workspace and Flutter packages publish with Flutter's SDK.
      # The pub token registered above is shared between the two SDKs.
      - name: Restore Flutter SDK on PATH
        if: steps.check.outputs.skip == 'false'
        run: dirname "$(command -v flutter)" >> "$GITHUB_PATH"

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: |
          dart --version
          cd "packages/$PKG" && dart pub publish --force

  publish-packages:
    name: Publish ${{ matrix.package }}
    needs: publish-core
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        package:
          - health_forge
          - health_forge_apple
          - health_forge_ghc
          - health_forge_oura
          - health_forge_strava
    env:
      PKG: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: dart pub get

      - name: Skip if version already published
        id: check
        run: |
          VERSION=$(awk '/^version:/{print $2; exit}' "packages/$PKG/pubspec.yaml")
          if curl -sfI "https://pub.dev/api/packages/$PKG/versions/$VERSION" >/dev/null; then
            echo "$PKG $VERSION already on pub.dev — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Activate Melos on PATH
        if: steps.check.outputs.skip == 'false'
        run: dart pub global activate melos

      - name: Bootstrap
        if: steps.check.outputs.skip == 'false'
        run: dart run melos bootstrap

      - name: Generate
        if: steps.check.outputs.skip == 'false'
        run: dart run melos run generate --no-select

      - name: Dry run
        if: steps.check.outputs.skip == 'false'
        run: cd "packages/$PKG" && dart pub publish --dry-run

      # setup-dart fetches the short-lived GitHub OIDC token for pub.dev and
      # registers it with `dart pub token add`. Without it, `dart pub publish`
      # waits forever for an interactive browser login. It runs right before
      # publishing so the token is fresh.
      - uses: dart-lang/setup-dart@v1
        if: steps.check.outputs.skip == 'false'

      # setup-dart puts a standalone Dart first on PATH; put Flutter's back in
      # front so the workspace and Flutter packages publish with Flutter's SDK.
      # The pub token registered above is shared between the two SDKs.
      - name: Restore Flutter SDK on PATH
        if: steps.check.outputs.skip == 'false'
        run: dirname "$(command -v flutter)" >> "$GITHUB_PATH"

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: |
          dart --version
          cd "packages/$PKG" && dart pub publish --force
