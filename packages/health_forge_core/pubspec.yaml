name: health_forge_core
description: >-
  Pure Dart core library for health_forge — unified models, enums, provider
  interfaces, and a configurable conflict resolution engine for multi-source
  health records.
version: 0.2.0
homepage: https://github.com/mandarnilange/health_forge
repository: https://github.com/mandarnilange/health_forge/tree/main/packages/health_forge_core
issue_tracker: https://github.com/mandarnilange/health_forge/issues
topics:
  - health
  - health-data
  - wearables
  - data-model

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  test: ^1.31.1
  very_good_analysis: ^11.0.0
