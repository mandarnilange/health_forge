name: health_forge
description: >-
  Flutter toolkit aggregating health data from HealthKit, Health Connect, Oura,
  and Strava into a unified model with conflict resolution and local caching.
version: 0.2.0
homepage: https://github.com/mandarnilange/health_forge
repository: https://github.com/mandarnilange/health_forge/tree/main/packages/health_forge
issue_tracker: https://github.com/mandarnilange/health_forge/issues
topics:
  - health
  - healthkit
  - health-connect
  - wearables
  - flutter

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

resolution: workspace

dependencies:
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  health_forge_core: ^0.2.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
