name: health_forge_oura
description: >-
  Oura Ring REST API adapter for health_forge — fetches sleep, heart rate,
  readiness, stress, and activity via OAuth 2.0 PKCE with rate limiting.
version: 0.3.0
homepage: https://github.com/mandarnilange/health_forge
repository: https://github.com/mandarnilange/health_forge/tree/main/packages/health_forge_oura
issue_tracker: https://github.com/mandarnilange/health_forge/issues
topics:
  - health
  - oura
  - wearables
  - sleep-tracking
  - rest-api

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

resolution: workspace

dependencies:
  crypto: ^3.0.7
  dio: ^5.11.1
  flutter:
    sdk: flutter
  health_forge_core: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
